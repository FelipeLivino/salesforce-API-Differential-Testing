services:
  app:
    build: .
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      # Caminho fixo dentro do volume, independente do .env.
      DATABASE_PATH: /app/data/app.db
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - sqlite-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sqlite-data:
